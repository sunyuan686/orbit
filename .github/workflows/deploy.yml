name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-orbit-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      ORBIT_D1_DATABASE_ID: ${{ vars.ORBIT_D1_DATABASE_ID }}
      ORBIT_SITE_URL: ${{ vars.ORBIT_SITE_URL }}
      ORBIT_VAPID_PUBLIC_KEY: ${{ vars.ORBIT_VAPID_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Generate deployment configuration
        run: npm run deploy:config

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      - name: Verify PWA build artifacts
        run: npm run verify:pwa
        working-directory: web

      - name: Apply D1 migrations
        run: npm run db:migrate:remote

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --config wrangler.local.toml
