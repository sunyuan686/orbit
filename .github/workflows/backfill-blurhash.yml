name: Backfill blurhash (production)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    name: Backfill asset blurhash on D1
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Backfill blurhash from R2
        run: npm run db:backfill-blurhash:remote -- --confirm --source=r2
