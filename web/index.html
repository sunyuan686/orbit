<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Orbit</title>
    <meta name="description" content="Orbit — 两个人的时间轨道" />
    <meta name="application-name" content="Orbit" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131315" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Orbit" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" media="(prefers-color-scheme: light)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-dark.png" media="(prefers-color-scheme: dark)" />

    <!-- 首帧外观初始化：在任何绘制之前同步应用用户外观偏好。
         键名与 src/lib/accent.ts、src/hooks/useTheme.ts 保持一致；此脚本是这些状态的首帧唯一写入点。 -->
    <script>
      (function () {
        var d = document.documentElement;
        try {
          var theme = localStorage.getItem("orbit-theme");
          var dark =
            theme === "dark" ||
            (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches);
          d.classList.toggle("dark", dark);
          d.style.colorScheme = dark ? "dark" : "light";

          var metas = document.querySelectorAll('meta[name="theme-color"]');
          var themeColor = dark ? "#131315" : "#fafaf9";
          for (var i = 0; i < metas.length; i++) {
            metas[i].setAttribute("content", themeColor);
          }

          var accent = localStorage.getItem("orbit-accent-theme");
          if (accent === "dusk") accent = "indigo";
          if (accent === "stone") accent = "amber";
          if (accent) d.dataset.accent = accent;

          var bg = localStorage.getItem("orbit-canvas-bg");
          if (bg) d.dataset.bg = bg;

          var fontMode = localStorage.getItem("orbit-font-mode");
          if (fontMode) d.dataset.fontMode = fontMode;

          var fontSize = localStorage.getItem("orbit-font-size");
          if (fontSize) d.dataset.fontSize = fontSize;

          var grain = localStorage.getItem("orbit-grain-opacity");
          if (grain !== null) d.style.setProperty("--grain-opacity", grain);
        } catch (e) {
          /* localStorage 不可用时使用默认外观 */
        }
      })();
    </script>

    <!-- 中文字体 Noto Serif SC（标题栈中位于本地宋体之后的回退）：非阻塞加载，
         避免大陆网络下 fonts.googleapis.com 不可达时阻塞首绘。拉丁字体已自托管（src/fonts.css）。 -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&display=swap"></noscript>

    <!-- App shell 启动屏：JS 执行前的品牌化首屏。
         位于 #root 之外的唯一 DOM 实例，由 React 渲染出首个有效帧后经 lib/bootScreen.ts 淡出移除，
         冷启动全程无卸载重建。首帧关键令牌内联自包含，与 DESIGN.md 严格对齐，禁止依赖打包 CSS 解析。 -->
    <style>
      :root {
        --color-bg: oklch(0.985 0.002 250);
        --color-border: oklch(0.90 0.003 250);
        --color-text-primary: oklch(0.18 0.01 250);
        --color-text-muted: oklch(0.66 0.008 250);
        color-scheme: light;
      }
      html.dark {
        --color-bg: #131315;
        --color-border: #2c2c31;
        --color-text-primary: #f4f4f6;
        --color-text-muted: #71717a;
        color-scheme: dark;
      }
      [data-bg="studio"] { --color-bg: #f4f4f6; }
      [data-bg="mist"] { --color-bg: oklch(0.985 0.004 165); }
      [data-bg="warm-linen"] { --color-bg: oklch(0.982 0.008 75); }
      html.dark[data-bg] { --color-bg: #131315; }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: var(--viewport-height, 100vh);
        overflow: hidden;
        background-color: #fafaf9;
        background-color: var(--color-bg);
      }
      html.dark, html.dark body {
        background-color: #131315;
      }
      #root {
        width: 100%;
        height: var(--viewport-height, 100vh);
        background-color: #fafaf9;
        background-color: var(--color-bg);
      }
      html.dark #root {
        background-color: #131315;
      }
      .orbit-boot {
        position: fixed;
        inset: 0;
        width: 100%;
        height: var(--viewport-height, 100vh);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: var(--color-bg);
        z-index: 99999;
      }
      .orbit-boot-orbit {
        position: relative;
        width: 46px;
        height: 46px;
        border: 1px solid var(--color-border);
        border-radius: 50%;
        animation: orbit-boot-spin 4.5s linear infinite;
      }
      .orbit-boot-dot {
        position: absolute;
        top: -3.5px;
        left: 50%;
        width: 7px;
        height: 7px;
        margin-left: -3.5px;
        border-radius: 50%;
        background: var(--color-text-primary);
      }
      .orbit-boot-name {
        margin: 0;
        font-family: "Source Serif 4", "Songti SC", STSong, Georgia, ui-serif, serif;
        font-size: 15px;
        letter-spacing: 0.32em;
        text-indent: 0.32em;
        color: var(--color-text-muted);
      }
      .orbit-boot--leave {
        pointer-events: none;
        animation: orbit-boot-out 0.4s ease forwards;
      }
      @keyframes orbit-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes orbit-boot-out {
        to {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .orbit-boot-orbit {
          animation: none;
        }
        .orbit-boot--leave {
          animation: none;
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="orbit-boot" id="orbit-boot" role="status" aria-label="加载中">
      <div class="orbit-boot-orbit" aria-hidden="true">
        <span class="orbit-boot-dot"></span>
      </div>
      <p class="orbit-boot-name">Orbit</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
