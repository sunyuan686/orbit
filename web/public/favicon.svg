<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    .orbit-ring { stroke: #78716c; }
    .star-main { fill: #292524; }
    .star-accent { fill: #ea580c; }
    @media (prefers-color-scheme: dark) {
      .orbit-ring { stroke: #a8a29e; }
      .star-main { fill: #fafaf9; }
      .star-accent { fill: #fb923c; }
    }
  </style>
  <ellipse cx="16" cy="16" rx="11" ry="4.2" stroke-width="1.3" class="orbit-ring" transform="rotate(-22 16 16)"/>
  <circle cx="23.6" cy="12.2" r="1.8" class="star-main"/>
  <circle cx="8.4" cy="19.8" r="1.2" class="star-accent"/>
</svg>




