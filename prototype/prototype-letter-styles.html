<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-style="letterform">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orbit 信箱 · 知名设计语言对比</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&family=Libre+Baskerville:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Shippori+Mincho:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet" />
  <style>
    :root, [data-theme="light"] {
      --ui: "Inter", system-ui, "PingFang SC", sans-serif;
      --bg: #f6f5f2;
      --surface: #fff;
      --border: #e5e2db;
      --text: #1c1b19;
      --muted: #8a867e;
      --secondary: #5c5852;
      --accent: #1c1b19;
      --on: #f6f5f2;
    }
    [data-theme="dark"] {
      --bg: #141311;
      --surface: #1c1b19;
      --border: #2e2c28;
      --text: #f0eee8;
      --muted: #8a867e;
      --secondary: #b5b0a6;
      --accent: #f0eee8;
      --on: #141311;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--ui);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .shell { max-width: 920px; margin: 0 auto; padding: 28px 22px 80px; }
    .top { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .top h1 { margin: 0; font-size: 1.25rem; font-weight: 500; letter-spacing: -0.02em; }
    .top p { margin: 4px 0 0; font-size: 0.8rem; color: var(--muted); }
    .btn {
      height: 34px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--surface); color: var(--text); font: 500 0.8rem/1 var(--ui); cursor: pointer;
    }
    .btn-fill { background: var(--accent); color: var(--on); border-color: transparent; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .tab-group { margin-bottom: 10px; }
    .tab-label {
      display: block; margin: 0 0 6px;
      font-size: 0.68rem; font-weight: 500; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted);
    }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
    .chip {
      height: 32px; padding: 0 12px; border: 1px solid transparent; border-radius: 999px;
      background: transparent; color: var(--secondary); font: 500 0.78rem/1 var(--ui); cursor: pointer;
    }
    .chip[aria-selected="true"] {
      background: var(--surface); border-color: var(--border); color: var(--text);
    }
    .chip.chip-archive { opacity: 0.92; }
    .desc {
      margin: 0 0 20px; max-width: 52rem;
      font-size: 0.84rem; color: var(--secondary); line-height: 1.55;
    }
    .desc strong { color: var(--text); font-weight: 500; }
    .desc a { color: var(--text); }

    .board {
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 28px;
    }
    .card {
      display: block; width: 100%; padding: 0; border: 0; background: none;
      color: inherit; text-align: left; cursor: pointer; font: inherit;
    }
    .card:focus-visible { outline: 2px solid #6b8cff; outline-offset: 3px; }

    /* ========== 1 KINFOLK ========== */
    [data-style="kinfolk"] {
      --serif: "EB Garamond", "Songti SC", serif;
      --paper: #f7f6f2;
      --ink: #1a1917;
      --sage: #dbded5;
    }
    [data-theme="dark"][data-style="kinfolk"] {
      --paper: #1a1917; --ink: #f2f0ea; --sage: #2a2c28;
    }
    [data-style="kinfolk"] .board { background: var(--paper); border-color: transparent; padding: 36px 28px; }
    [data-style="kinfolk"] .grid { gap: 40px 28px; }
    [data-style="kinfolk"] .k-cover {
      aspect-ratio: 4 / 5;
      width: 100%;
      object-fit: cover;
      display: block;
      background: var(--sage);
      filter: grayscale(0.15) contrast(1.02);
    }
    [data-style="kinfolk"] .k-body { padding: 16px 2px 0; }
    [data-style="kinfolk"] .k-meta {
      margin: 0 0 8px;
      font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted);
    }
    [data-style="kinfolk"] .k-title {
      margin: 0 0 8px;
      font-family: var(--serif);
      font-size: 1.55rem; font-weight: 400; line-height: 1.2;
      letter-spacing: -0.02em; color: var(--ink);
      text-wrap: balance;
    }
    [data-style="kinfolk"] .k-snip {
      margin: 0;
      font-family: var(--serif);
      font-size: 0.95rem; line-height: 1.55; color: var(--secondary);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    [data-style="kinfolk"] .card:hover .k-cover { opacity: 0.92; }

    /* ========== 2 MIDORI / Traveler's ========== */
    [data-style="midori"] {
      --serif: "Shippori Mincho", "Songti SC", serif;
      --cream: #f3efe6;
      --band: #2c2a26;
      --ink: #2a2620;
    }
    [data-theme="dark"][data-style="midori"] {
      --cream: #24201c; --band: #cfc8bc; --ink: #efe9df;
    }
    [data-style="midori"] .board {
      background:
        radial-gradient(ellipse at 50% 0%, oklch(0.92 0.02 80 / 0.5), transparent 50%),
        #ebe6dc;
      border-color: #ddd6c8;
    }
    [data-theme="dark"][data-style="midori"] .board { background: #1a1815; border-color: #333; }
    [data-style="midori"] .m-pass {
      position: relative;
      background: var(--cream);
      border: 1px solid oklch(0.75 0.02 80 / 0.55);
      padding: 18px 16px 16px;
      min-height: 200px;
      box-shadow: 0 1px 0 oklch(1 0 0 / 0.4) inset, 0 8px 20px oklch(0.4 0.02 60 / 0.08);
    }
    [data-style="midori"] .m-pass::before {
      content: "";
      position: absolute; left: 0; right: 0; top: 0; height: 3px;
      background: var(--band);
    }
    [data-style="midori"] .m-row {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
      margin-bottom: 14px;
    }
    [data-style="midori"] .m-stamp {
      width: 52px; height: 52px; flex-shrink: 0;
      border: 1.5px solid oklch(0.45 0.06 25 / 0.55);
      border-radius: 50%;
      display: grid; place-items: center;
      font-family: var(--serif);
      font-size: 0.65rem; line-height: 1.2; text-align: center;
      color: oklch(0.45 0.06 25 / 0.85);
      transform: rotate(-8deg);
      letter-spacing: 0.04em;
    }
    [data-style="midori"] .m-date {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.68rem; letter-spacing: 0.06em; color: var(--muted);
    }
    [data-style="midori"] .m-title {
      margin: 0 0 8px;
      font-family: var(--serif);
      font-size: 1.15rem; font-weight: 500; color: var(--ink); line-height: 1.35;
    }
    [data-style="midori"] .m-snip {
      margin: 0 0 16px;
      font-family: var(--serif);
      font-size: 0.88rem; line-height: 1.7; color: var(--secondary);
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    [data-style="midori"] .m-foot {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 12px; border-top: 1px dashed oklch(0.7 0.02 80 / 0.55);
      font-size: 0.72rem; color: var(--muted);
    }
    [data-style="midori"] .m-thumb {
      width: 36px; height: 36px; object-fit: cover; border-radius: 2px;
      box-shadow: 0 0 0 1px oklch(0 0 0 / 0.08);
    }
    [data-style="midori"] .card:hover .m-pass { transform: translateY(-2px); transition: transform 160ms ease; }

    /* ========== 3 APPLE News / Editorial ========== */
    [data-style="apple"] {
      --serif: "Newsreader", "Songti SC", serif;
      --sans: "Inter", system-ui, "PingFang SC", sans-serif;
    }
    [data-style="apple"] .board { background: transparent; border: 0; padding: 0; }
    [data-style="apple"] .grid { gap: 20px; }
    [data-style="apple"] .a-card {
      background: var(--surface);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 2px oklch(0 0 0 / 0.04), 0 8px 24px oklch(0 0 0 / 0.05);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }
    [data-style="apple"] .card:hover .a-card {
      transform: scale(1.015);
      box-shadow: 0 2px 4px oklch(0 0 0 / 0.05), 0 16px 40px oklch(0 0 0 / 0.1);
    }
    [data-style="apple"] .a-cover {
      width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; background: #ddd;
    }
    [data-style="apple"] .a-cover.none {
      aspect-ratio: 16 / 7;
      background: linear-gradient(135deg, #e8e4dc, #d5d0c6);
    }
    [data-theme="dark"][data-style="apple"] .a-cover.none {
      background: linear-gradient(135deg, #2a2824, #1f1d1a);
    }
    [data-style="apple"] .a-body { padding: 16px 18px 18px; }
    [data-style="apple"] .a-label {
      margin: 0 0 6px;
      font-family: var(--sans);
      font-size: 0.68rem; font-weight: 600; letter-spacing: 0.02em;
      color: #c45c26;
    }
    [data-style="apple"] .a-title {
      margin: 0 0 6px;
      font-family: var(--serif);
      font-size: 1.25rem; font-weight: 500; line-height: 1.25; letter-spacing: -0.015em;
    }
    [data-style="apple"] .a-snip {
      margin: 0 0 12px;
      font-family: var(--sans);
      font-size: 0.84rem; line-height: 1.45; color: var(--secondary);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    [data-style="apple"] .a-meta {
      margin: 0; font-size: 0.72rem; color: var(--muted);
    }

    /* ========== 4 STRIPE PRESS / 书页 ========== */
    [data-style="press"] {
      --serif: "Newsreader", Georgia, "Songti SC", serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    [data-style="press"] .board {
      background: #fff; border-color: #e6e6e6; padding: 8px 0;
    }
    [data-theme="dark"][data-style="press"] .board { background: var(--surface); border-color: var(--border); }
    [data-style="press"] .grid {
      display: flex; flex-direction: column; gap: 0;
    }
    [data-style="press"] .p-row {
      display: grid;
      grid-template-columns: 72px 1fr auto;
      gap: 20px;
      align-items: baseline;
      padding: 22px 24px;
      border-bottom: 1px solid #eee;
      transition: background 120ms ease;
    }
    [data-theme="dark"][data-style="press"] .p-row { border-bottom-color: var(--border); }
    [data-style="press"] .card:hover .p-row,
    [data-style="press"] .card:focus-visible .p-row { background: #fafafa; }
    [data-theme="dark"][data-style="press"] .card:hover .p-row { background: oklch(1 0 0 / 0.03); }
    [data-style="press"] .p-num {
      font-family: var(--mono);
      font-size: 0.72rem; letter-spacing: 0.08em; color: var(--muted);
    }
    [data-style="press"] .p-title {
      margin: 0 0 4px;
      font-family: var(--serif);
      font-size: 1.35rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.25;
    }
    [data-style="press"] .p-snip {
      margin: 0;
      font-size: 0.88rem; color: var(--secondary); line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
    }
    [data-style="press"] .p-side {
      text-align: right; font-size: 0.75rem; color: var(--muted); white-space: nowrap;
    }
    [data-style="press"] .p-side b {
      display: block; font-weight: 500; color: var(--text); margin-bottom: 2px;
    }

    /* ========== 5 SLOWLY 邮票（做对的版本） ========== */
    [data-style="slowly"] {
      --serif: "EB Garamond", Georgia, "Songti SC", serif;
      --navy: #1e3a5f;
      --cream: #f7f3ea;
    }
    [data-theme="dark"][data-style="slowly"] {
      --navy: #9db7d4; --cream: #1c1a17;
    }
    [data-style="slowly"] .board {
      background: linear-gradient(180deg, #eef2f7, #e8edf4);
      border: 0;
    }
    [data-theme="dark"][data-style="slowly"] .board {
      background: linear-gradient(180deg, #161820, #12141a);
    }
    [data-style="slowly"] .grid {
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 32px 20px;
      justify-items: center;
    }
    [data-style="slowly"] .s-wrap {
      width: 100%; max-width: 168px;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    [data-style="slowly"] .s-stamp {
      width: 100%;
      aspect-ratio: 3 / 4;
      position: relative;
      padding: 7px;
      background: #fff;
      /* 齿孔 */
      -webkit-mask-image: radial-gradient(circle at 0 50%, transparent 5px, #000 5.5px),
        radial-gradient(circle at 100% 50%, transparent 5px, #000 5.5px);
      mask:
        radial-gradient(circle 5px at left, #0000 98%, #000) left / 8px 100% repeat-y,
        radial-gradient(circle 5px at right, #0000 98%, #000) right / 8px 100% repeat-y,
        radial-gradient(circle 5px at top, #0000 98%, #000) top / 100% 8px repeat-x,
        radial-gradient(circle 5px at bottom, #0000 98%, #000) bottom / 100% 8px repeat-x,
        linear-gradient(#000, #000) center / calc(100% - 10px) calc(100% - 10px) no-repeat;
      box-shadow: 0 10px 28px oklch(0.35 0.04 250 / 0.18);
      transition: transform 180ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    [data-style="slowly"] .card:hover .s-stamp { transform: translateY(-4px) rotate(-1deg); }
    [data-style="slowly"] .s-stamp img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    [data-style="slowly"] .s-stamp .ph {
      width: 100%; height: 100%;
      background: linear-gradient(145deg, #d8e0ea, #b9c6d6);
      display: grid; place-items: center;
      font-family: var(--serif); font-size: 1.5rem; color: var(--navy); opacity: 0.5;
    }
    [data-style="slowly"] .s-post {
      position: absolute; right: 12px; bottom: 12px;
      width: 36px; height: 36px; border-radius: 50%;
      border: 1.5px solid oklch(0.35 0.06 250 / 0.55);
      color: oklch(0.35 0.06 250 / 0.75);
      font-size: 0.58rem; font-weight: 600; letter-spacing: 0.02em;
      display: grid; place-items: center; text-align: center; line-height: 1.1;
      background: oklch(1 0 0 / 0.55); transform: rotate(-12deg);
    }
    [data-style="slowly"] .s-cap { text-align: center; width: 100%; }
    [data-style="slowly"] .s-title {
      margin: 0 0 3px;
      font-family: var(--serif);
      font-size: 1rem; line-height: 1.25; color: var(--text);
    }
    [data-style="slowly"] .s-meta {
      margin: 0; font-size: 0.7rem; color: var(--muted);
    }

    /* ========== 归档：信封物件系列（保留对比） ========== */
    .env-card { width: 100%; max-width: 220px; margin: 0 auto; }
    .env {
      --w: 100%; --h: 148px;
      position: relative; width: var(--w); height: var(--h);
      perspective: 900px;
      filter: drop-shadow(0 10px 16px oklch(0.35 0.02 60 / 0.14));
    }
    .env-face {
      position: absolute; inset: 0; overflow: hidden; border-radius: 3px;
    }
    .env-letter-peek {
      position: absolute; z-index: 2; left: 8%; right: 8%; top: 10%; bottom: 22%;
      padding: 10px 12px; overflow: hidden;
      transform: translateY(18%);
      font-size: 0.78rem; line-height: 1.3;
    }
    .env-letter-peek b { display: block; margin-bottom: 4px; font-weight: 500; }
    .env-letter-peek span {
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      opacity: 0.7; font-size: 0.68rem;
    }
    .env-flap {
      position: absolute; inset: 0; z-index: 6;
      transform-origin: top; pointer-events: none;
    }
    .env-flap-shape {
      position: absolute; inset: 0;
      clip-path: polygon(0 0, 100% 0, 50% 58%);
    }
    .env-seal {
      position: absolute; left: 50%; top: 44%; z-index: 7;
      width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%;
    }
    .env-meta-face {
      position: absolute; left: 12px; bottom: 12px; z-index: 5;
      font-size: 0.85rem; line-height: 1.2;
    }
    .env-meta-face small { display: block; font-size: 0.62rem; opacity: 0.65; margin-top: 2px; }
    .env-stamp-sm {
      position: absolute; top: 10px; right: 10px; z-index: 5;
      width: 44px; height: 52px; object-fit: cover;
    }
    .env-mark-sm {
      position: absolute; left: 10px; top: 10px; z-index: 5;
      width: 38px; height: 38px; border-radius: 50%;
      display: grid; place-items: center; font-size: 0.55rem; font-weight: 600;
      text-align: center; line-height: 1.1; transform: rotate(-12deg);
    }
    .env-cap { margin-top: 10px; text-align: center; font-size: 0.72rem; color: var(--muted); }
    .env-cap em { display: block; font-style: normal; color: var(--text); font-size: 0.9rem; margin-bottom: 2px; }
    .pocket-l, .pocket-r, .pocket-b { position: absolute; inset: 0; z-index: 3; }
    .pocket-b { z-index: 4; }

    /* A kraft */
    [data-style="kraft"] .board {
      background: linear-gradient(180deg, oklch(0.95 0.025 78), oklch(0.91 0.03 72));
    }
    [data-theme="dark"][data-style="kraft"] .board {
      background: linear-gradient(180deg, oklch(0.2 0.016 75), oklch(0.16 0.014 70));
    }
    [data-style="kraft"] .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); justify-items: center; }
    [data-style="kraft"] .env-face {
      background: linear-gradient(145deg, oklch(0.9 0.038 75), oklch(0.78 0.045 65));
    }
    [data-theme="dark"][data-style="kraft"] .env-face {
      background: linear-gradient(145deg, oklch(0.32 0.03 72), oklch(0.22 0.025 64));
    }
    [data-style="kraft"] .pocket-l { background: oklch(0.84 0.04 70); clip-path: polygon(0 0, 52% 56%, 0 100%); }
    [data-style="kraft"] .pocket-r { background: oklch(0.78 0.045 65); clip-path: polygon(100% 0, 48% 56%, 100% 100%); }
    [data-style="kraft"] .pocket-b { background: oklch(0.88 0.035 75); clip-path: polygon(0 100%, 50% 54%, 100% 100%); }
    [data-theme="dark"][data-style="kraft"] .pocket-l { background: oklch(0.27 0.028 68); }
    [data-theme="dark"][data-style="kraft"] .pocket-r { background: oklch(0.22 0.025 64); }
    [data-theme="dark"][data-style="kraft"] .pocket-b { background: oklch(0.3 0.03 72); }
    [data-style="kraft"] .env-flap-shape { background: linear-gradient(180deg, oklch(0.9 0.038 75), oklch(0.78 0.045 65)); filter: drop-shadow(0 2px 3px oklch(0 0 0 / 0.15)); }
    [data-style="kraft"] .env-letter-peek {
      background: oklch(0.985 0.018 92); color: oklch(0.28 0.03 55);
      border: 1px solid oklch(0.75 0.02 80 / 0.35);
      font-family: "Source Serif 4", "Songti SC", serif;
    }
    [data-theme="dark"][data-style="kraft"] .env-letter-peek { background: oklch(0.24 0.02 85); color: oklch(0.9 0.02 85); }
    [data-style="kraft"] .env-seal {
      background: radial-gradient(circle at 32% 28%, oklch(0.58 0.11 32), oklch(0.42 0.12 28));
      box-shadow: 0 3px 6px oklch(0 0 0 / 0.28), inset 0 2px 2px oklch(1 0 0 / 0.25);
    }
    [data-style="kraft"] .env-seal::after {
      content: "O"; position: absolute; inset: 0; display: grid; place-items: center;
      font-family: "Instrument Serif", serif; color: oklch(1 0 0 / 0.45); font-size: 0.85rem;
    }
    [data-style="kraft"] .env-meta-face { font-family: "Instrument Serif", serif; }
    [data-style="kraft"] .env-stamp-sm { padding: 2px; background: #fff; transform: rotate(4deg); box-shadow: 0 0 0 1px oklch(0 0 0 / 0.12); }
    [data-style="kraft"] .env-mark-sm { border: 1.5px double oklch(0.4 0.05 25 / 0.45); color: oklch(0.4 0.05 25 / 0.65); }
    [data-style="kraft"] .env-cap em { font-family: "Instrument Serif", serif; }
    [data-style="kraft"] .read h3,
    [data-style="kraft"] .read .body,
    [data-style="kraft"] .read .sign { font-family: "Source Serif 4", "Songti SC", serif; }
    [data-style="kraft"] .stage-panel { background: oklch(0.94 0.02 75); }
    [data-style="kraft"] .read {
      background-image:
        linear-gradient(90deg, oklch(0.55 0.12 25 / 0.28) 0 1px, transparent 1px),

    /* ========== 初稿卡片皮（第一版原型，保留） ========== */
    [data-style="baseline"] .board,

      --stamp-ring: oklch(0.45 0.04 25 / 0.55);
      --shadow-card: 0 2px 10px oklch(0 0 0 / 0.06);

      --env: oklch(0.2 0.014 80);
      --env-deep: oklch(0.17 0.012 75);
      --paper: oklch(0.22 0.014 80);
      --paper-edge: oklch(0.28 0.016 80);
      --fold-line: oklch(0.55 0.02 80 / 0.35);

    .d-snip {
      margin: 0; font-size: 0.875rem; color: var(--secondary);

    }
    .d-meta {
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem;
      font-size: 0.75rem; color: var(--muted);
    }
    .d-postmark {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 2.5rem; height: 2.5rem; padding: 0 6px;

    [data-style="baseline"] .d-base {

    }
    [data-style="flat"] .d-f .seal {
      width: 56px; height: 56px; border-radius: 50%; object-fit: cover;
      grid-row: 1 / span 3; grid-column: 2;
      box-shadow: 0 0 0 3px var(--paper), 0 0 0 4px var(--border);
    }
    [data-style="flat"] .d-f .count {
      font-family: var(--font-h); font-size: 0.75rem; color: var(--muted); letter-spacing: 0.04em;
    }

    /* D peek */
    [data-style="peek"] .d-p { position: relative; padding-top: 18px; }
    [data-style="peek"] .d-p-paper {
      position: relative; z-index: 2; margin: 0 14px -12px; padding: 12px 14px 20px;
      background: var(--paper); border: 1px solid var(--paper-edge); border-bottom: 0;
      border-radius: 3px 3px 0 0; box-shadow: 0 -2px 8px oklch(0 0 0 / 0.04);
      background-image: repeating-linear-gradient(
        transparent, transparent 22px, oklch(0.75 0.02 80 / 0.18) 22px, oklch(0.75 0.02 80 / 0.18) 23px
      );
      background-position: 0 2.4em;
    }
    [data-theme="dark"][data-style="peek"] .d-p-paper {
      background-image: repeating-linear-gradient(
        transparent, transparent 22px, oklch(0.4 0.02 80 / 0.35) 22px, oklch(0.4 0.02 80 / 0.35) 23px
      );
    }
    [data-style="peek"] .d-p-paper .t {
      margin: 0 0 4px; font-family: var(--font-h); font-size: 1.0625rem; font-weight: 400;
    }
    [data-style="peek"] .d-p-pocket {
      position: relative; z-index: 1; background: var(--env); border: 1px solid var(--border);
      border-radius: 0 0 10px 10px; padding: 20px 16px 12px; box-shadow: var(--shadow-card);
    }
    [data-style="peek"] .d-p-pocket::before {
      content: ""; position: absolute; inset: 0 0 auto 0; height: 22px;
      background: linear-gradient(180deg, var(--env-deep), transparent); opacity: 0.7; pointer-events: none;
    }
    [data-style="peek"] .d-p.has-cover .d-p-inner {
      display: grid; grid-template-columns: 1fr 56px; gap: 10px; align-items: end;
    }
    [data-style="peek"] .d-p .stamp {
      width: 56px; height: 56px; object-fit: cover; border-radius: 2px;
      transform: rotate(-2deg); box-shadow: 0 0 0 1px oklch(0 0 0 / 0.1);
    }

    /* E stack */
    [data-style="stack"] .d-s-wrap { position: relative; padding-bottom: 6px; }
    [data-style="stack"] .d-s-wrap.has-stack::before,
    [data-style="stack"] .d-s-wrap.has-stack::after {
      content: ""; position: absolute; left: 8px; right: 8px; height: 100%;
      border: 1px solid var(--border); border-radius: 6px; background: var(--env-deep); z-index: 0;
    }
    [data-style="stack"] .d-s-wrap.has-stack::before { top: 4px; opacity: 0.55; }
    [data-style="stack"] .d-s-wrap.has-stack::after { top: 8px; left: 14px; right: 14px; opacity: 0.35; }
    [data-style="stack"] .d-s {
      position: relative; z-index: 1; background: var(--env); border: 1px solid var(--border);
      border-radius: 6px; box-shadow: var(--shadow-card); overflow: hidden;
      transition: transform 150ms ease;
    }
    [data-style="stack"] .card:hover .d-s { transform: translateY(-2px); }
    [data-style="stack"] .d-s-top { display: flex; align-items: stretch; min-height: 72px; }
    [data-style="stack"] .d-s-edge {
      width: 14px; flex-shrink: 0;
      background:
        linear-gradient(135deg, var(--env-deep) 50%, transparent 50%),
        linear-gradient(225deg, var(--env-deep) 50%, transparent 50%);
      background-size: 100% 50%; background-position: top, bottom; background-repeat: no-repeat;
      border-right: 1px solid var(--fold-line);
    }
    [data-style="stack"] .d-s-body { flex: 1; display: grid; gap: 4px; padding: 12px 14px; }
    [data-style="stack"] .d-s.has-cover .d-s-body { grid-template-columns: 1fr 52px; }
    [data-style="stack"] .d-s .t {
      margin: 0; font-family: var(--font-h); font-size: 1.0625rem; font-weight: 400;
    }
    [data-style="stack"] .d-s .stamp {
      width: 52px; height: 52px; object-fit: cover; border-radius: 2px;
      grid-row: 1 / span 3; grid-column: 2;
    }
    [data-style="stack"] .d-s .chip {
      display: inline-block; padding: 1px 7px; border-radius: 999px;
      border: 1px solid var(--border); font-size: 0.6875rem; color: var(--muted);
    }
    [data-style="stack"] .d-s-replies {
      border-top: 1px solid var(--border); background: var(--paper);
      padding: 10px 14px 12px 28px; display: grid; gap: 8px;
    }
    [data-style="stack"] .d-s-reply {
      padding: 8px 10px; border-left: 2px solid var(--border);
      background: var(--surface); border-radius: 0 4px 4px 0;
      font-size: 0.8125rem;
    }
    [data-style="stack"] .d-s-reply small { display: block; margin-top: 2px; font-size: 0.6875rem; color: var(--muted); }

    /* ========== D · 现代（新） ========== */
    /* 1 soft — Things / Linear 冷静产品感 */
    [data-style="soft"] .board {
      background: transparent; border: 0; padding: 4px 0;
    }
    [data-style="soft"] .grid {
      display: flex; flex-direction: column; gap: 10px;
    }
    [data-style="soft"] .sf {
      display: grid; gap: 6px;
      padding: 18px 18px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      transition: border-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
    }
    [data-style="soft"] .sf.has-cover {
      grid-template-columns: 1fr 72px; align-items: start;
    }
    [data-style="soft"] .card:hover .sf {
      border-color: oklch(0.75 0.01 80);
      box-shadow: 0 8px 28px oklch(0.4 0.02 60 / 0.08);
      transform: translateY(-1px);
    }
    [data-theme="dark"][data-style="soft"] .card:hover .sf {
      border-color: oklch(0.4 0.01 80);
      box-shadow: 0 8px 28px oklch(0 0 0 / 0.35);
    }
    [data-style="soft"] .sf-kicker {
      margin: 0;
      font-size: 0.68rem; font-weight: 500; letter-spacing: 0.02em;
      color: var(--muted);
    }
    [data-style="soft"] .sf-title {
      margin: 0;
      font-size: 1.125rem; font-weight: 550; letter-spacing: -0.025em; line-height: 1.3;
    }
    [data-style="soft"] .sf-snip {
      margin: 0;
      font-size: 0.875rem; line-height: 1.5; color: var(--secondary);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    [data-style="soft"] .sf-cover {
      width: 72px; height: 72px; border-radius: 10px; object-fit: cover;
      grid-row: 1 / span 4; grid-column: 2;
    }
    [data-style="soft"] .sf-foot {
      display: flex; align-items: center; gap: 8px; margin-top: 4px;
      font-size: 0.72rem; color: var(--muted);
    }
    [data-style="soft"] .sf-dot {
      width: 6px; height: 6px; border-radius: 50%; background: #c45c26; flex-shrink: 0;
    }
    [data-style="soft"] .sf-pill {
      margin-left: auto;
      padding: 2px 8px; border-radius: 999px;
      background: oklch(0.96 0.005 80); font-size: 0.68rem; color: var(--secondary);
    }
    [data-theme="dark"][data-style="soft"] .sf-pill { background: oklch(0.24 0.01 80); }
    [data-style="soft"] .stage-panel { border-radius: 16px; }
    [data-style="soft"] .read h3 {
      font-family: var(--ui); font-weight: 550; letter-spacing: -0.03em; font-size: 1.5rem;
    }
    [data-style="soft"] .read .salute { font-style: normal; font-size: 0.85rem; opacity: 0.55; }
    [data-style="soft"] .read .sign { font-style: normal; font-family: var(--ui); font-size: 0.9rem; font-weight: 500; }

    /* 2 swiss — 当代瑞士排版 */
    [data-style="swiss"] .board {
      background: #fff; border-color: #e8e8e8; padding: 8px 0;
    }
    [data-theme="dark"][data-style="swiss"] .board { background: var(--surface); border-color: var(--border); }
    [data-style="swiss"] .grid { display: flex; flex-direction: column; gap: 0; }
    [data-style="swiss"] .sw {
      display: grid;
      grid-template-columns: 88px 1fr minmax(64px, auto);
      gap: 20px;
      padding: 28px 24px;
      border-bottom: 1px solid #eee;
      align-items: start;
      transition: background 120ms ease;
    }
    [data-theme="dark"][data-style="swiss"] .sw { border-bottom-color: var(--border); }

    }
    [data-style="swiss"] .sw-date b {

      font-size: 1.35rem; font-weight: 500; letter-spacing: -0.03em; line-height: 1.2;

    [data-style="swiss"] .sw-snip {
      margin: 0; font-size: 0.9rem; color: var(--secondary); line-height: 1.5;
      max-width: 36em;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    [data-style="swiss"] .sw-side {
      text-align: right; font-size: 0.72rem; color: var(--muted);
    }
    [data-style="swiss"] .sw-thumb {
      width: 56px; height: 56px; object-fit: cover; border-radius: 2px; margin-bottom: 8px;
    }
    [data-style="swiss"] .stage-panel { border-radius: 0; }
    [data-style="swiss"] .read h3 {
      font-family: var(--ui); font-weight: 500; letter-spacing: -0.04em; font-size: 2rem;
    }
    [data-style="swiss"] .read {
      border-top: 1px solid var(--border); margin: 0 24px 24px; padding-top: 24px;
    }

    /* 3 glass — 当代磨砂表面 */
    [data-style="glass"] .board {
      background:
        radial-gradient(ellipse 80% 60% at 10% 0%, oklch(0.92 0.03 250 / 0.35), transparent 50%),

        oklch(0.14 0.01 80);
    }
    [data-style="glass"] .grid {
      display: flex; flex-direction: column; gap: 12px;
    }
    [data-style="glass"] .gl {
      display: grid; gap: 8px;
      padding: 18px 18px 16px;
      border-radius: 18px;
      background: oklch(1 0 0 / 0.55);

    [data-style="glass"] .card:hover .gl {
      transform: translateY(-2px);

    }
    [data-theme="dark"][data-style="glass"] .card:hover .gl {
      background: oklch(0.26 0.015 80 / 0.7);
    }
    [data-style="glass"] .gl-title {
      margin: 0; font-size: 1.1rem; font-weight: 550; letter-spacing: -0.02em;
    }
    [data-style="glass"] .gl-snip {
      margin: 0; font-size: 0.84rem; color: var(--secondary); line-height: 1.45;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    [data-style="glass"] .gl-meta {
      font-size: 0.7rem; color: var(--muted); display: flex; gap: 8px; align-items: center;
    }
    [data-style="glass"] .gl-cover {
      width: 64px; height: 64px; border-radius: 12px; object-fit: cover;
      grid-row: 1 / span 3; grid-column: 2;
      box-shadow: 0 2px 8px oklch(0 0 0 / 0.1);
    }
    [data-style="glass"] .stage-panel {
      background: oklch(1 0 0 / 0.75); backdrop-filter: blur(20px); border-radius: 20px;
    }
    [data-style="glass"] .read h3 { font-family: var(--ui); font-weight: 550; letter-spacing: -0.03em; }

    /* 4 author — 现代双色轨（双方身份） */
    [data-style="author"] .board { background: transparent; border: 0; padding: 0; }
    [data-style="author"] .grid { display: flex; flex-direction: column; gap: 8px; }
    [data-style="author"] .au {
      display: grid;
      grid-template-columns: 4px 1fr auto;
      gap: 14px;
      align-items: start;
      padding: 16px 16px 16px 0;
      border-radius: 12px;
      transition: background 120ms ease;
    }
    [data-style="author"] .card:hover .au { background: oklch(0.97 0.005 80); }
    [data-theme="dark"][data-style="author"] .card:hover .au { background: oklch(1 0 0 / 0.04); }
    [data-style="author"] .au-rail {
      align-self: stretch; border-radius: 4px; min-height: 48px;
    }
    [data-style="author"] .au-rail.a { background: oklch(0.72 0.06 55); }
    [data-style="author"] .au-rail.b { background: oklch(0.65 0.05 230); }
    [data-style="author"] .au-title {
      margin: 0 0 4px; font-size: 1.05rem; font-weight: 550; letter-spacing: -0.02em;
    }
    [data-style="author"] .au-snip {
      margin: 0 0 6px; font-size: 0.84rem; color: var(--secondary); line-height: 1.45;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    [data-style="author"] .au-meta { font-size: 0.72rem; color: var(--muted); }
    [data-style="author"] .au-cover {
      width: 56px; height: 56px; border-radius: 8px; object-fit: cover;
    }
    [data-style="author"] .read h3 { font-family: var(--ui); font-weight: 550; letter-spacing: -0.025em; }
    [data-style="author"] .stage-panel { border-radius: 14px; }

    /* 5 letterform — Soft + 书信语法 */
    [data-style="letterform"] .board { background: transparent; border: 0; padding: 4px 0; }
    [data-style="letterform"] .grid { display: flex; flex-direction: column; gap: 10px; }
    [data-style="letterform"] .lf {
      position: relative;
      display: grid; gap: 6px;
      padding: 18px 18px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      transition: border-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
    }
    [data-style="letterform"] .lf::before {
      content: "";
      position: absolute; top: 0; left: 18px; right: 18px; height: 1px;
      background: linear-gradient(90deg, transparent, oklch(0.75 0.02 70 / 0.7), transparent);
    }
    [data-style="letterform"] .lf.has-cover { grid-template-columns: 1fr 72px; align-items: start; }
    [data-style="letterform"] .card:hover .lf {
      border-color: oklch(0.75 0.01 80);
      box-shadow: 0 8px 28px oklch(0.4 0.02 60 / 0.08);

    [data-theme="dark"][data-style="letterform"] .card:hover .lf {
      border-color: oklch(0.4 0.01 80);
      box-shadow: 0 8px 28px oklch(0 0 0 / 0.35);

    [data-style="letterform"] .lf-dear {
      margin: 2px 0 0;
      font-size: 0.78rem; font-weight: 500; letter-spacing: 0.01em;
      color: var(--muted);
    }
    [data-style="letterform"] .lf-title {
      margin: 0;
      font-size: 1.125rem; font-weight: 550; letter-spacing: -0.025em; line-height: 1.3;
    }
    [data-style="letterform"] .lf-snip {
      margin: 0;
      font-size: 0.875rem; line-height: 1.5; color: var(--secondary);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    [data-style="letterform"] .lf-sign {
      margin: 6px 0 0;
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
      font-size: 0.72rem; color: var(--muted);
    }
    [data-style="letterform"] .lf-sign em {
      font-style: normal; font-weight: 500; color: var(--secondary);
    }
    [data-style="letterform"] .lf-cover {
      width: 72px; height: 72px; border-radius: 10px; object-fit: cover;
      grid-row: 1 / span 4; grid-column: 2;
    }
    [data-style="letterform"] .stage-panel { border-radius: 16px; }

      border-top: 1px solid var(--border);
      margin: 0 24px 8px; padding-top: 20px;

    [data-style="letterform"] .read .lf-head {

    }
    [data-style="letterform"] .read h3 {
      font-family: var(--ui); font-weight: 550; letter-spacing: -0.03em; font-size: 1.45rem;
    }
    [data-style="letterform"] .read .salute {
      font-style: normal; font-size: 0.9rem; font-weight: 500; color: var(--text); opacity: 0.7;
    }
    [data-style="letterform"] .read .sign {
      font-style: normal; font-family: var(--ui); font-size: 0.95rem; font-weight: 500;
    }

    /* 6 flatmail — 纯色几何封 + 纸 peek */
    [data-style="flatmail"] .board {
      background: oklch(0.96 0.008 80); border: 0; padding: 12px 8px;
    }
    [data-theme="dark"][data-style="flatmail"] .board { background: oklch(0.14 0.01 80); }

      gap: 20px;
      justify-items: stretch;
    }
    [data-style="flatmail"] .fm {
      display: grid; gap: 10px;
    }
    [data-style="flatmail"] .fm-env {
      position: relative;
      height: 148px;
      border-radius: 12px;
      background: oklch(0.88 0.02 75);

    [data-theme="dark"][data-style="flatmail"] .fm-env.tone-b { background: oklch(0.28 0.03 230); }
    [data-style="flatmail"] .fm-paper {
      position: absolute;
      left: 14px; right: 14px; top: 10px;
      height: 78px;
      padding: 12px 14px 10px;
      background: #fff;
      border-radius: 6px 6px 0 0;
      box-shadow: 0 -1px 0 oklch(0 0 0 / 0.04);

    [data-theme="dark"][data-style="flatmail"] .fm-paper { background: oklch(0.92 0.01 85); color: #1a1814; }
    [data-style="flatmail"] .fm-paper b {
      display: block; font-size: 0.92rem; font-weight: 550; letter-spacing: -0.02em;

    [data-theme="dark"][data-style="flatmail"] .fm-pocket { background: oklch(0.22 0.02 70); }

    [data-style="flatmail"] .fm-seal-dot {

    [data-style="flatmail"] .fm-meta b { font-weight: 500; color: var(--secondary); }
    [data-style="flatmail"] .stage-panel { border-radius: 16px; overflow: hidden; }
    [data-style="flatmail"] .read h3 {
      font-family: var(--ui); font-weight: 550; letter-spacing: -0.03em; font-size: 1.4rem;
    }
    [data-style="flatmail"] .read .salute { font-style: normal; font-weight: 500; opacity: 0.65; }
    [data-style="flatmail"] .read .sign { font-style: normal; font-family: var(--ui); font-weight: 500; }
    .fm-open {
      position: relative; height: 180px; margin: 8px 24px 0;
      display: flex; align-items: flex-end; justify-content: center;
      perspective: 600px;
    }
    .fm-open-shell {
      position: relative; width: min(280px, 100%); height: 120px;
      border-radius: 10px; background: oklch(0.86 0.02 75);
      overflow: hidden;
    }
    [data-theme="dark"] .fm-open-shell { background: oklch(0.28 0.02 75); }
    .fm-open-paper {
      position: absolute; left: 16px; right: 16px; bottom: 28px; height: 70px;
      background: #fff; border-radius: 6px 6px 0 0;
      transform: translateY(24px); opacity: 0.6;
      transition: transform 480ms cubic-bezier(0.22, 1, 0.36, 1) 120ms, opacity 320ms ease 120ms;
    }
    [data-theme="dark"] .fm-open-paper { background: oklch(0.92 0.01 85); }
    .fm-open-flap {
      position: absolute; left: 0; right: 0; top: 0; height: 58px;
      background: oklch(0.78 0.03 68);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 2;
    }
    [data-theme="dark"] .fm-open-flap { background: oklch(0.24 0.02 68); }
    .fm-open.is-open .fm-open-flap { transform: rotateX(168deg); }
    .fm-open.is-open .fm-open-paper { transform: translateY(-36px); opacity: 1; }
    [data-style="flatmail"] .read.is-pending { opacity: 0; transform: translateY(8px); }
    [data-style="flatmail"] .read {
      transition: opacity 320ms ease, transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ========== Stage / 打开后 ========== */
    .stage {
      position: fixed; inset: 0; z-index: 40; display: none;
      align-items: center; justify-content: center; padding: 20px;
      background: oklch(0.15 0.01 70 / 0.45); backdrop-filter: blur(10px);
    }
    .stage.open { display: flex; }
    .stage-panel {
      width: min(480px, 100%); max-height: min(90vh, 720px); overflow: auto;
      background: var(--surface); border-radius: 16px; border: 1px solid var(--border);
      box-shadow: 0 24px 60px oklch(0 0 0 / 0.25);
    }
    .stage-head {
      padding: 20px 22px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    }
    .stage-head h2 {
      margin: 0; font-size: 0.72rem; font-weight: 500; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted);
    }
    .read {
      padding: 8px 28px 28px;
      animation: up 380ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes up {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    .read .salute { margin: 0 0 12px; font-style: italic; color: var(--secondary); }
    .read h3 {
      margin: 0 0 8px; font-size: 1.65rem; font-weight: 400; line-height: 1.2; letter-spacing: -0.02em;
    }
    .read .rm { margin: 0 0 20px; font-size: 0.75rem; color: var(--muted); }
    .read .body { font-size: 1rem; line-height: 1.85; }
    .read .body p { margin: 0 0 1.1em; }
    .read .sign { margin: 28px 0 0; text-align: right; font-style: italic; font-size: 1.1rem; }
    .read .sign small { display: block; margin-top: 4px; font-style: normal; font-size: 0.68rem; color: var(--muted); }
    .stage-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 0 22px 20px; }

    [data-style="kinfolk"] .stage-panel { background: #f7f6f2; border: 0; border-radius: 2px; }
    [data-style="kinfolk"] .read h3,
    [data-style="kinfolk"] .read .salute,
    [data-style="kinfolk"] .read .sign,
    [data-style="kinfolk"] .read .body { font-family: "EB Garamond", "Songti SC", serif; }
    [data-style="kinfolk"] .read { padding: 12px 40px 40px; }
    [data-style="kinfolk"] .read h3 { font-size: 2rem; }
    [data-style="kinfolk"] .hero-img {
      width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; margin-bottom: 8px;
      filter: grayscale(0.1);
    }

    [data-style="midori"] .stage-panel { background: #f3efe6; border-radius: 2px; border-color: #ddd6c8; }
    [data-style="midori"] .read h3,
    [data-style="midori"] .read .body,
    [data-style="midori"] .read .sign { font-family: "Shippori Mincho", "Songti SC", serif; }
    [data-style="midori"] .read {
      background-image: repeating-linear-gradient(
        transparent, transparent 27px, oklch(0.7 0.03 80 / 0.2) 27px, oklch(0.7 0.03 80 / 0.2) 28px
      );
      background-position: 0 5.5em;
    }

    [data-style="apple"] .read h3 { font-family: "Newsreader", "Songti SC", serif; }
    [data-style="apple"] .hero-img {
      width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; border-radius: 12px 12px 0 0;
    }

    [data-style="press"] .stage-panel { border-radius: 2px; }
    [data-style="press"] .read h3 { font-family: "Newsreader", Georgia, serif; font-size: 2rem; }
    [data-style="press"] .read .rm {
      font-family: "IBM Plex Mono", monospace; letter-spacing: 0.06em; text-transform: uppercase;
    }
    [data-style="press"] .read {
      border-left: 1px solid #eee; margin: 12px 28px 28px; padding-left: 24px;
    }

    [data-style="slowly"] .stage-panel { background: #f7f3ea; }
    [data-style="slowly"] .read h3,
    [data-style="slowly"] .read .body,
    [data-style="slowly"] .read .sign { font-family: "EB Garamond", "Songti SC", serif; }
    [data-style="slowly"] .read-stamp {
      width: 88px; height: 110px; float: right; margin: 0 0 12px 16px; padding: 5px; background: #fff;
      box-shadow: 0 4px 12px oklch(0.35 0.04 250 / 0.15); transform: rotate(3deg);
    }
    [data-style="slowly"] .read-stamp img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .note {
      margin-top: 24px; padding: 12px 14px; border: 1px dashed var(--border); border-radius: 8px;
      font-size: 0.72rem; color: var(--muted); line-height: 1.6;
    }
    .note code { font-family: ui-monospace, Menlo, monospace; color: var(--secondary); }

    @media (max-width: 560px) {
      .board { padding: 18px; }
      [data-style="press"] .p-row { grid-template-columns: 48px 1fr; }
      [data-style="press"] .p-side { grid-column: 2; text-align: left; margin-top: 6px; }
    }
  </style>
</head>
<body>

      现共 23 套（A5 + B6 + C6 + D6）。推荐对照：<strong>Letterform</strong> / <strong>FlatMail</strong>。

  <script>
    const STYLES = {

      mailface: {

      flat: {

      },
      peek: {

      },

        label: "Index",
        desc: `<strong>Swiss 排版</strong>（现代）— 大日期数字 + 细线分隔 + 紧字距标题。当代杂志/目录感，不装信封。`,
      },
      glass: {
        label: "Letter",
        desc: `<strong>Glass 磨砂</strong>（现代）— 半透明表面 + blur，偏 iOS 当代。氛围强，注意性能与暗色对比。`,
      },
      author: {
        label: "Letter",
        desc: `<strong>Author 双色轨</strong>（现代）— 左侧色条区分双方作者。关系清晰，适合双人空间，零复古。`,
      },
      letterform: {
        label: "Correspondence",
        desc: `<strong>Letterform 书信</strong>（推荐）— Soft 产品底 + 称谓/落款语法 + 顶折线。列表现代，信感来自书信结构；阅读页带信头。`,
      },

      },

    const ARCHIVE = new Set([
      "kraft", "invite", "postal", "fold", "linen", "stone",
      "baseline", "vflap", "mailface", "flat", "peek", "stack",
    ]);

    const LETTERS = [
      {
        title: "写给你，关于这个夏天",

        body: "我想把六月里那些来不及说的话，慢慢写在纸上。不是抱怨，是想让你看见我的另一面。\n\n太阳落得很晚，风里有一点海水的味道。若你也还醒着，就把这封信当作我坐在你对面。\n\n不必急着回。看见就好。",
        salute: "亲爱的小麒子，",
        author: "小园子",

      {

        salute: "亲爱的小园子，",
        author: "小麒子",
        date: "2026-03-02",
        replies: 1,
        cover: "",
        coverWide: "",
      },
      {
        title: "不必回复的一封",
        snippet: "有些话写下来就够了。你忙的时候看见就好，不用特意回。",
        body: "有些话写下来就够了。你忙的时候看见就好，不用特意回。\n\n今天路过那家店，忽然想起你上次说想再去一次。",
        salute: "小麒子，",
        author: "小园子",
        date: "2025-11-08",
        replies: 0,
        cover: "https://picsum.photos/seed/orbit-k3/800/1000",
        coverWide: "https://picsum.photos/seed/orbit-k3/1200/750",
      },
      {
        title: "冬至之后",
        snippet: "天短了，想你的时间却变长。光刚好落在你常坐的那一侧。",
        body: "天短了，想你的时间却变长。\n\n附上一张窗边的照片——光刚好落在你常坐的那一侧。希望你收到的时候，也刚好有一点暖。",
        salute: "亲爱的小园子，",
        author: "小麒子",
        date: "2025-12-22",
        replies: 3,
        cover: "https://picsum.photos/seed/orbit-k4/800/1000",
        coverWide: "https://picsum.photos/seed/orbit-k4/1200/750",
      },
    ];

    const board = document.getElementById("board");
    const desc = document.getElementById("desc");

    function styleId() {
      return document.documentElement.getAttribute("data-style");
    }

    function render() {
      const id = styleId();
      desc.innerHTML = STYLES[id].desc;
      document.getElementById("stage-label").textContent = STYLES[id].label;
      board.innerHTML = "";
      board.className = "board";

      const grid = document.createElement("div");
      grid.className = "grid";

      LETTERS.forEach((letter, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "card";
        btn.innerHTML = cardHTML(id, letter, i);
        btn.addEventListener("click", () => openStage(letter));
        grid.appendChild(btn);
      });
      board.appendChild(grid);
    }

    function cardHTML(id, letter, i) {
      if (id === "kinfolk") {
        const img = letter.cover
          ? `<img class="k-cover" src="${letter.cover}" alt="" />`
          : `<div class="k-cover" style="background:var(--sage)"></div>`;
        return `${img}<div class="k-body">
          <p class="k-meta">${letter.author} · ${letter.date}</p>
          <h3 class="k-title">${letter.title}</h3>
          <p class="k-snip">${letter.snippet}</p>
        </div>`;
      }
      if (id === "midori") {
        const thumb = letter.cover
          ? `<img class="m-thumb" src="${letter.cover}" alt="" />`
          : `<span></span>`;
        const stamp = letter.replies > 0
          ? `<div class="m-stamp">回信<br>${letter.replies}</div>`
          : `<div class="m-stamp" style="border-style:dashed;opacity:.5">私信</div>`;
        return `<div class="m-pass">
          <div class="m-row">
            <span class="m-date">${letter.date.replace(/-/g, ".")}</span>
            ${stamp}
          </div>
          <h3 class="m-title">${letter.title}</h3>
          <p class="m-snip">${letter.snippet}</p>
          <div class="m-foot"><span>${letter.author}</span>${thumb}</div>
        </div>`;
      }
      if (id === "apple") {
        const cover = letter.coverWide
          ? `<img class="a-cover" src="${letter.coverWide}" alt="" />`
          : `<div class="a-cover none"></div>`;
        return `<div class="a-card">${cover}<div class="a-body">
          <p class="a-label">信箱${letter.replies ? " · " + letter.replies + " 封回信" : ""}</p>
          <h3 class="a-title">${letter.title}</h3>
          <p class="a-snip">${letter.snippet}</p>
          <p class="a-meta">${letter.author} · ${letter.date}</p>
        </div></div>`;
      }
      if (id === "press") {
        const num = String(i + 1).padStart(2, "0");
        return `<div class="p-row">
          <span class="p-num">${num}</span>
          <div>
            <h3 class="p-title">${letter.title}</h3>
            <p class="p-snip">${letter.snippet}</p>
          </div>
          <div class="p-side"><b>${letter.author}</b>${letter.date}</div>
        </div>`;
      }
      if (id === "slowly") {
        const art = letter.cover
          ? `<img src="${letter.cover}" alt="" />`
          : `<div class="ph">${letter.author.slice(0, 1)}</div>`;
        const post = letter.replies > 0
          ? `<div class="s-post">回<br>${letter.replies}</div>`
          : "";
        return `<div class="s-wrap">
          <div class="s-stamp">${art}${post}</div>
          <div class="s-cap">
            <h3 class="s-title">${letter.title}</h3>
            <p class="s-meta">${letter.author} · ${letter.date}</p>
          </div>
        </div>`;
      }
      if (id === "stone") {
        const stamp = letter.cover
          ? `<img class="env-stamp-sm" src="${letter.cover}" alt="" />`
          : "";
        const badge = letter.replies > 0
          ? `<span class="stone-badge">${letter.replies} 回信</span>`
          : `<span></span>`;
        return `<div class="env-card"><div class="env"><div class="env-face">
          ${stamp}
          <h3 class="stone-title">${letter.title}</h3>
          <p class="stone-snip">${letter.snippet}</p>
          <div class="stone-meta"><span>${letter.author} · ${letter.date}</span>${badge}</div>
        </div></div></div>`;
      }
      if (id === "baseline") {
        const cover = letter.cover
          ? `<img class="cover" src="${letter.cover}" alt="" />`
          : "";
        const badge = letter.replies > 0
          ? `<span class="d-badge">${letter.replies} 封回信</span>`
          : "";
        return `<div class="d-base${letter.cover ? " has-cover" : ""}">
          <h3 class="t">${letter.title}</h3>
          <p class="d-snip">${letter.snippet}</p>
          <div class="d-meta"><span>${letter.author}</span><span>${letter.date}</span>${badge}</div>
          ${cover}
        </div>`;
      }
      if (id === "vflap") {
        const stamp = letter.cover
          ? `<img class="stamp" src="${letter.cover}" alt="" />`
          : "";
        const mark = letter.replies > 0
          ? `<span class="d-postmark">回信<br>${letter.replies}</span>`
          : "";
        return `<div class="d-v${letter.cover ? " has-cover" : ""}">
          <div class="d-v-flap" aria-hidden="true"></div>
          <div class="d-v-body">
            <h3 class="t">${letter.title}</h3>
            <p class="d-snip">${letter.snippet}</p>
            <div class="d-meta"><span>${letter.author}</span><span>${letter.date}</span>${mark}</div>
            ${stamp}
          </div>
        </div>`;
      }
      if (id === "mailface") {
        const stamp = letter.cover
          ? `<img class="stamp" src="${letter.cover}" alt="" />`
          : "";
        const mark = letter.replies > 0
          ? `<span class="d-postmark">回信<br>${letter.replies}</span>`
          : "";
        return `<div class="d-m${letter.cover ? " has-cover" : ""}">
          <div class="d-m-addr">
            <dl><dt>From</dt><dd>${letter.author}</dd></dl>
            <dl><dt>Date</dt><dd>${letter.date}</dd></dl>
            ${mark}
          </div>
          <h3 class="t">${letter.title}</h3>
          <p class="d-snip">${letter.snippet}</p>
          ${stamp}
        </div>`;
      }
      if (id === "flat") {
        const seal = letter.cover
          ? `<img class="seal" src="${letter.cover}" alt="" />`
          : "";
        const count = letter.replies > 0
          ? `<span class="count">${letter.replies} 封回信</span>`
          : "";
        return `<div class="d-f${letter.cover ? " has-cover" : ""}">
          <div class="d-f-flap" aria-hidden="true"></div>
          <div class="d-f-body">
            <h3 class="t">${letter.title}</h3>
            <p class="d-snip">${letter.snippet}</p>
            <div class="d-meta"><span>${letter.author}</span><span>${letter.date}</span>${count}</div>
            ${seal}
          </div>
        </div>`;
      }
      if (id === "peek") {
        const stamp = letter.cover
          ? `<img class="stamp" src="${letter.cover}" alt="" />`
          : "";
        const mark = letter.replies > 0
          ? `<span class="d-postmark">回信<br>${letter.replies}</span>`
          : "";
        return `<div class="d-p${letter.cover ? " has-cover" : ""}">
          <div class="d-p-paper">
            <h3 class="t">${letter.title}</h3>
            <p class="d-snip">${letter.snippet}</p>
          </div>
          <div class="d-p-pocket">
            <div class="d-p-inner">
              <div class="d-meta"><span>${letter.author}</span><span>${letter.date}</span>${mark}</div>
              ${stamp}
            </div>
          </div>
        </div>`;
      }
      if (id === "stack") {
        const stamp = letter.cover
          ? `<img class="stamp" src="${letter.cover}" alt="" />`
          : "";
        const chip = letter.replies > 0
          ? `<span class="chip">${letter.replies} 封回信 · 示意展开</span>`
          : "";
        const replies = letter.replies > 0
          ? `<div class="d-s-replies">
              <div class="d-s-reply">回信预览一<small>对方 · 次日</small></div>
              ${letter.replies > 1 ? `<div class="d-s-reply">回信预览二<small>你 · 再次日</small></div>` : ""}
            </div>`
          : "";
        return `<div class="d-s-wrap${letter.replies > 0 ? " has-stack" : ""}">
          <div class="d-s${letter.cover ? " has-cover" : ""}">
            <div class="d-s-top">
              <div class="d-s-edge" aria-hidden="true"></div>
              <div class="d-s-body">
                <h3 class="t">${letter.title}</h3>
                <p class="d-snip">${letter.snippet}</p>
                <div class="d-meta"><span>${letter.author}</span><span>${letter.date}</span>${chip}</div>
                ${stamp}
              </div>
            </div>
            ${replies}
          </div>
        </div>`;
      }
      if (id === "soft") {
        const cover = letter.cover
          ? `<img class="sf-cover" src="${letter.cover}" alt="" />`
          : "";
        const pill = letter.replies > 0
          ? `<span class="sf-pill">${letter.replies} 回信</span>`
          : "";
        return `<div class="sf${letter.cover ? " has-cover" : ""}">
          <p class="sf-kicker">信箱</p>
          <h3 class="sf-title">${letter.title}</h3>
          <p class="sf-snip">${letter.snippet}</p>
          <div class="sf-foot"><span class="sf-dot" aria-hidden="true"></span><span>${letter.author} · ${letter.date}</span>${pill}</div>
          ${cover}
        </div>`;
      }
      if (id === "swiss") {
        const day = letter.date.slice(8);
        const ym = letter.date.slice(0, 7).replace("-", ".");
        const thumb = letter.cover
          ? `<img class="sw-thumb" src="${letter.cover}" alt="" />`
          : "";
        return `<div class="sw">
          <div class="sw-date"><b>${day}</b>${ym}</div>
          <div>
            <h3 class="sw-title">${letter.title}</h3>
            <p class="sw-snip">${letter.snippet}</p>
          </div>
          <div class="sw-side">${thumb}<div>${letter.author}${letter.replies ? "<br>" + letter.replies + " 回信" : ""}</div></div>
        </div>`;
      }
      if (id === "glass") {
        const cover = letter.cover
          ? `<img class="gl-cover" src="${letter.cover}" alt="" />`
          : "";
        return `<div class="gl${letter.cover ? " has-cover" : ""}">
          <h3 class="gl-title">${letter.title}</h3>
          <p class="gl-snip">${letter.snippet}</p>
          <div class="gl-meta"><span>${letter.author}</span><span>${letter.date}</span>${letter.replies ? `<span>${letter.replies} 回信</span>` : ""}</div>
          ${cover}
        </div>`;
      }
      if (id === "author") {
        const tone = /园|圆/.test(letter.author) ? "a" : "b";
        const cover = letter.cover
          ? `<img class="au-cover" src="${letter.cover}" alt="" />`
          : `<span></span>`;
        return `<div class="au">
          <div class="au-rail ${tone}" aria-hidden="true"></div>
          <div>
            <h3 class="au-title">${letter.title}</h3>
            <p class="au-snip">${letter.snippet}</p>
            <div class="au-meta">${letter.author} · ${letter.date}${letter.replies ? " · " + letter.replies + " 回信" : ""}</div>
          </div>
          ${cover}
        </div>`;
      }
      if (id === "letterform") {
        const cover = letter.cover
          ? `<img class="lf-cover" src="${letter.cover}" alt="" />`
          : "";
        const dear = (letter.salute || "").replace(/，$/, "").replace(/^亲爱的/, "致 ");
        const replies = letter.replies > 0 ? `${letter.replies} 回信` : letter.date;
        return `<div class="lf${letter.cover ? " has-cover" : ""}">
          <p class="lf-dear">${dear}</p>
          <h3 class="lf-title">${letter.title}</h3>
          <p class="lf-snip">${letter.snippet}</p>
          <div class="lf-sign"><em>— ${letter.author}</em><span>${replies}</span></div>
          ${cover}
        </div>`;
      }
      if (id === "flatmail") {
        const tone = /园|圆/.test(letter.author) ? "tone-a" : "tone-b";
        return `<div class="fm">
          <div class="fm-env ${tone}">
            <div class="fm-paper"><b>${letter.title}</b><span>${letter.snippet}</span></div>
            <div class="fm-pocket" aria-hidden="true"></div>
            <div class="fm-flap" aria-hidden="true"></div>
            <span class="fm-seal-dot" aria-hidden="true"></span>
          </div>
          <div class="fm-meta"><b>${letter.author}</b><span>${letter.date}${letter.replies ? " · " + letter.replies + " 回" : ""}</span></div>
        </div>`;
      }
      if (ARCHIVE.has(id)) {
        return envArchiveHTML(id, letter);
      }
      return "";
    }

    function envArchiveHTML(id, letter) {
      const stamp = letter.cover
        ? `<img class="env-stamp-sm" src="${letter.cover}" alt="" />`
        : "";
      const mark = letter.replies > 0
        ? `<div class="env-mark-sm">回信<br>${letter.replies}</div>`
        : "";
      const fold = id === "fold" ? `<div class="fold-tri" aria-hidden="true"></div>` : "";
      return `<div class="env-card">
        <div class="env">
          <div class="env-face">
            ${fold}
            <div class="env-letter-peek" data-from="${letter.author} · ${letter.date}"><b>${letter.title}</b><span>${letter.snippet}</span></div>
            <div class="pocket-l"></div>
            <div class="pocket-r"></div>
            <div class="pocket-b"></div>
            ${stamp}
            ${mark}
            <div class="env-meta-face">${letter.author}<small>${letter.date}</small></div>
          </div>
          <div class="env-flap"><div class="env-flap-shape"></div></div>
          <div class="env-seal" aria-hidden="true"></div>
        </div>
        <div class="env-cap"><em>${letter.title}</em>${letter.author} · ${letter.date}</div>
      </div>`;
    }

    function openStage(letter) {
      const id = styleId();
      const readEl = document.getElementById("read");
      const hero = document.getElementById("stage-hero");
      if (window.__fmOpenTimer) {
        clearTimeout(window.__fmOpenTimer);
        window.__fmOpenTimer = null;
      }
      hero.innerHTML = "";
      readEl.classList.remove("is-pending");
      const oldHead = readEl.querySelector(".lf-head");
      if (oldHead) oldHead.remove();

      document.getElementById("read-salute").textContent = letter.salute;
      document.getElementById("read-title").textContent = letter.title;
      document.getElementById("read-meta").textContent = `${letter.author} · ${letter.date}`;
      document.getElementById("read-body").innerHTML = letter.body
        .split(/\n\n+/).map((p) => `<p>${p}</p>`).join("");
      document.getElementById("read-sign").innerHTML =
        `${letter.author}<small>${letter.date}</small>`;

      if (id === "kinfolk" && letter.coverWide) {
        hero.innerHTML = `<img class="hero-img" src="${letter.coverWide}" alt="" />`;
      } else if (id === "apple" && letter.coverWide) {
        hero.innerHTML = `<img class="hero-img" src="${letter.coverWide}" alt="" />`;
      } else if (id === "slowly" && letter.cover) {
        document.getElementById("read-body").insertAdjacentHTML(
          "afterbegin",
          `<div class="read-stamp"><img src="${letter.cover}" alt="" /></div>`
        );
      } else if (id === "letterform") {
        const dear = (letter.salute || "").replace(/，$/, "");
        readEl.insertAdjacentHTML(
          "afterbegin",
          `<div class="lf-head"><span>LETTER</span><span>${letter.date}</span></div>`
        );
        document.getElementById("read-salute").textContent = dear;
      } else if (id === "flatmail") {
        readEl.classList.add("is-pending");
        hero.innerHTML = `<div class="fm-open" id="fm-open">
          <div class="fm-open-shell">
            <div class="fm-open-paper" aria-hidden="true"></div>
            <div class="fm-open-flap" aria-hidden="true"></div>
          </div>
        </div>`;
        requestAnimationFrame(() => {
          const el = document.getElementById("fm-open");
          if (el) el.classList.add("is-open");
        });
        window.__fmOpenTimer = setTimeout(() => {
          hero.innerHTML = "";
          readEl.classList.remove("is-pending");
          window.__fmOpenTimer = null;
        }, 620);
      }

      document.getElementById("stage").classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeStage() {
      if (window.__fmOpenTimer) {
        clearTimeout(window.__fmOpenTimer);
        window.__fmOpenTimer = null;
      }
      document.getElementById("stage").classList.remove("open");
      document.body.style.overflow = "";
      document.getElementById("stage-hero").innerHTML = "";
      document.getElementById("read").classList.remove("is-pending");
      const head = document.querySelector("#read .lf-head");
      if (head) head.remove();
      const stamp = document.querySelector("#read-body .read-stamp");
      if (stamp) stamp.remove();
    }

    document.querySelectorAll(".chip[data-style]").forEach((chip) => {
      chip.addEventListener("click", () => {
        document.documentElement.setAttribute("data-style", chip.dataset.style);
        document.querySelectorAll(".chip[data-style]").forEach((c) =>
          c.setAttribute("aria-selected", String(c === chip))
        );
        render();
      });
    });

    document.getElementById("stage-close").addEventListener("click", closeStage);
    document.getElementById("stage-done").addEventListener("click", closeStage);
    document.getElementById("stage").addEventListener("click", (e) => {
      if (e.target.id === "stage") closeStage();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeStage();
    });

    const themeBtn = document.getElementById("theme-toggle");
    themeBtn.addEventListener("click", () => {
      const root = document.documentElement;
      const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      themeBtn.textContent = next === "dark" ? "切到亮色" : "切到暗色";
    });

    render();
  </script>
</body>
</html>
