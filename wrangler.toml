name = "orbit"
main = "src/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Worker 靠近 D1，减少 API 多次查询的跨区 RTT
[placement]
mode = "smart"

# 前端静态资源（vite build 输出目录）
[assets]
directory = "web/dist"
# SPA 深链：/diary/:id 等路由刷新时回退到 index.html，由 React Router 接管
not_found_handling = "single-page-application"
# API 与 R2 媒体走 Worker；排除 Vite 打包的 js/css，避免与 /assets/* 路径冲突
run_worker_first = ["/api/*", "/assets/*", "!/assets/*.js", "!/assets/*.css"]

# D1 数据库（替换 database_id 为实际值）
[[d1_databases]]
binding = "DB"
database_name = "orbit-db"
database_id = "5a1f38cb-4b18-4f1d-8127-8624c3f79c8b"
migrations_dir = "src/db/migrations"

# R2 存储桶
[[r2_buckets]]
binding = "R2"
bucket_name = "orbit-media"

# 自定义域名（deploy 时 Cloudflare 自动创建 DNS + 证书）
[[routes]]
pattern = "orbitspace.top"
custom_domain = true

[vars]
BETTER_AUTH_URL = "https://orbitspace.top"
# 在 wrangler secret put 中设置：BETTER_AUTH_SECRET
# Workers AI 模型目录（设置页下拉）：CF_ACCOUNT_ID、CF_API_TOKEN

[ai]
binding = "AI"
# 无需额外配置

# Workers Logs：落盘到仪表盘排障；Trace 关闭以节省 Free 额度
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false

# 主动陪伴引擎调度器（DO Alarm，替代 Cron Trigger）
[[durable_objects.bindings]]
name = "COMPANION_SCHEDULER"
class_name = "CompanionScheduler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CompanionScheduler"]
